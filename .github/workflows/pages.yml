# claude-drafted: 2026-11-24 · 덱을 검사하고 GitHub Pages(github.io)에 올린다.
#   PR: 검사만.  main 에 올라오면: 검사 → 게시.  손으로 돌리기: Actions → pages → Run workflow.
# 액션은 판 번호를 커밋 주소로 고정했다(옆의 주석이 판 번호). 올릴 때는 주소와 주석을 같이 고친다.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 덱이 부르는 파일이 모두 있는가
        run: |
          missing=0
          refs=$(grep -oE '(src|href)="[^"#][^"]*"' index.html | sed -E 's/^(src|href)="//; s/"$//' | grep -vE '^(https?:|data:|mailto:)' | sort -u)
          refs="$refs $(grep -oE 'url\("[^"]+"\)' deck.css | sed -E 's/^url\("//; s/"\)$//' | sort -u)"
          for p in $refs; do
            [ "$p" = "media/portal-demo.mp4" ] && continue   # 녹화본은 없어도 된다(자리 그림이 보인다)
            [ -e "$p" ] || { echo "::error::없는 파일: $p"; missing=1; }
          done
          exit $missing

      - name: 밖에 나가면 안 되는 값이 없는가 (공개 저장소)
        run: |
          # AWS 키 · 계정 번호(12자리) · ARN · 개인 키 · GitHub 토큰 모양. 글 파일만 본다.
          if grep -rnIE 'AKIA[0-9A-Z]{16}|(^|[^0-9])[0-9]{12}([^0-9]|$)|arn:aws:|BEGIN [A-Z ]*PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_' \
               --include='*.html' --include='*.css' --include='*.js' --include='*.md' --include='*.svg' --include='*.yml' \
               --exclude-dir=.git --exclude-dir=.github --exclude-dir=vendor . ; then
            echo "::error::키 · 계정 번호 · ARN 모양이 보여요. 빼고 다시 올리세요."; exit 1
          fi

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
